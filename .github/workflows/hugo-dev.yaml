name: deploy

# 代码提交到main分支时触发，或约每3天定时拉最新浏览量重新构建
on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 */3 * *"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
              fetch-depth: 0

        - name: Setup Hugo
          uses: peaceiris/actions-hugo@v3
          with:
              hugo-version: "latest"
              extended: true

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
              node-version: "20"

        - name: Fetch pageviews
          run: node scripts/fetch-pageviews.js

        - name: Build Web
          run: hugo -D

        - name: Deploy Web
          uses: peaceiris/actions-gh-pages@v4
          with:
              PERSONAL_TOKEN: ${{ secrets.TOKEN }}
              EXTERNAL_REPOSITORY: ye-guan-xing/ye-guan-xing.github.io
              PUBLISH_BRANCH: main
              PUBLISH_DIR: ./public
              commit_message: auto deploy
